name: Mya Systems
description: 'Mya Systems was a San Francisco based HR-tech company, founded in 2012 by Eyal Grayevsky
  and James Maddox, that built Mya, a conversational-AI recruiting assistant automating candidate outreach,
  screening, scheduling and communications across the hiring lifecycle, integrating with major ATS, CRM
  and HRIS platforms such as Workday and SAP SuccessFactors. Backed by Emergence Capital, the company was
  acquired by The StepStone Group (Totaljobs) in May 2021, when its founders and engineering team joined
  StepStone; the standalone mya.com and hiremya.com developer, product and API surfaces are retired and
  mya.com now redirects to thestepstonegroup.com. No independent public API, developer portal or machine-readable
  specification remains for Mya Systems.'
